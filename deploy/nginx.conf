server {
    listen 80;
    server_name _;

    root /var/www/isales-web;
    index index.html;

    # SPA fallback — Vue Router uses HTML5 history mode.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket reverse proxy. proxy_read_timeout extended so long-lived
    # monitor connections aren't reaped at the default 60s.
    location /ws/ {
        proxy_pass http://127.0.0.1:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Gzip on for SPA assets.
    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;
}
